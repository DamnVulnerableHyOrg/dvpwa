name: OWASP Dependency Track Check

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cyclonedx-bom
        run: pip install --disable-pip-version-check cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: >
          cyclonedx-py requirements requirements.txt
          --output-format XML
          --output-file bom.xml
          --spec-version 1.5
          --mc-type application

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v4.1.0
        with:
          serverHostname: ${{ secrets.OWASP_DT_HOSTNAME }}
          apiKey: ${{ secrets.OWASP_DT_KEY }}
          projectName: ${{ github.event.repository.name }}
          projectVersion: ${{ github.ref_name }}
          bomFilename: bom.xml
          autoCreate: true
